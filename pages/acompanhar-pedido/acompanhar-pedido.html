<!-- pages/acompanhar-pedido/acompanhar-pedido.html -->
<section class="w-full px-4 py-10 bg-gray-100 min-h-screen">
  <div class="max-w-4xl mx-auto bg-white shadow-xl rounded-2xl p-6 md:p-8 flex flex-col gap-6
            md:max-h-[calc(100dvh-200px)] md:overflow-hidden">

    <!-- Título e descrição -->
    <div class="space-y-1">
      <h1 class="text-2xl md:text-3xl font-extrabold text-gray-900">Acompanhar Pedido</h1>
      <p class="text-sm md:text-base text-gray-600">
        Informe o <span class="font-semibold">número do pedido</span> e o <span class="font-semibold">CPF</span> do titular da compra.
      </p>
    </div>

    <!-- Form: linha (desktop) / coluna (mobile) -->
    <form id="formBuscarPedido" class="w-full space-y-3">
      <div class="flex flex-col md:flex-row md:items-end gap-3 md:gap-4">
        <!-- Número do pedido -->
        <div class="w-full md:w-64">
          <label for="inputNumeroPedido" class="text-xs font-medium text-gray-700">Número do pedido</label>
          <input
            id="inputNumeroPedido"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            autocomplete="off"
            placeholder="Ex.: 1427"
            class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-gray-900 text-sm shadow-sm focus:border-yellow-400 focus:ring-2 focus:ring-yellow-200 outline-none"
            aria-label="Número do pedido"
          />
        </div>

        <!-- CPF do titular -->
        <div class="w-full md:w-64">
          <label for="inputCpfPedido" class="text-xs font-medium text-gray-700">CPF do titular</label>
          <input
            id="inputCpfPedido"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="000.000.000-00"
            class="mt-1 w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-gray-900 text-sm shadow-sm focus:border-yellow-400 focus:ring-2 focus:ring-yellow-200 outline-none"
            aria-label="CPF do titular"
          />
        </div>

        <!-- Botão -->
        <div class="w-full md:w-auto">
          <button
            id="btnBuscarPedido"
            type="submit"
            class="mt-1 h-10 w-full md:w-auto px-5 rounded-lg bg-yellow-400 hover:bg-yellow-300 text-black font-semibold text-sm shadow-md transition focus-visible:ring-2 focus-visible:ring-yellow-300"
          >
            Buscar
          </button>
        </div>
      </div>

      <!-- Ajuda (linha inteira no desktop) -->
      <p class="text-sm text-gray-600">
        Usamos o CPF apenas para confirmar que o pedido é seu.
      </p>
    </form>

    <!-- Resultado -->
    <div
      id="containerPedidoGuest"
      class="space-y-6 bg-gray-50 p-4 md:p-5 rounded-xl border md:overflow-y-auto"
    >
      <p class="text-gray-500">
        Digite o número do pedido e o CPF acima e clique em <span class="font-semibold text-gray-700">Buscar</span>.
      </p>
    </div>
  </div>
</section>

<style>
  .clamp-2{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;}
</style>

<style>
  .clamp-2{
    display:-webkit-box;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
