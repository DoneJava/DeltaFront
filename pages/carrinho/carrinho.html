<!-- pages/carrinho/carrinho.html -->
<section class="w-full px-4 py-10 bg-gray-100 min-h-screen">
  <div class="max-w-6xl mx-auto bg-white shadow-xl rounded-xl p-6 flex flex-col" style="max-height: calc(100vh - 200px); overflow: hidden;">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Carrinho de Compras</h1>

    <!-- Itens do carrinho -->
    <div id="resumoProdutos" class="lg:col-span-1 space-y-4 bg-gray-50 p-4 rounded-xl border overflow-hidden overflow-y-auto max-h-[1800px]">
      <!-- Itens do carrinho serão renderizados aqui via JS -->
    </div>

    <!-- Total -->
    <div class="mt-6 text-right text-lg font-bold text-gray-800">
      Total: <span id="totalCarrinho" class="text-yellow-600">R$ 0,00</span>
    </div>

    <!-- Botão Finalizar -->
    <div class="mt-4 text-right">
      <button id="btnFinalizarCompra" class="bg-yellow-400 hover:bg-yellow-300 text-black font-bold py-3 px-6 rounded-lg shadow-md transition">
        Finalizar Compra
      </button>            
    </div>
  </div>
</section>
