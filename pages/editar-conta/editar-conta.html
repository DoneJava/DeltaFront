<section class="flex flex-col items-center justify-center w-full px-4 sm:px-6 py-10 sm:py-16 bg-gradient-to-br from-gray-100 to-gray-200">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-4xl p-6 sm:p-10">

    <form class="grid grid-cols-1 md:grid-cols-2 gap-6" id="editarContaForm">
      <!-- Nome -->
      <div class="flex flex-col">
        <label for="nome" class="text-sm text-gray-700 mb-1">Nome completo</label>
        <input type="text" id="nome" placeholder="Seu nome" class="p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>

      <!-- Email -->
      <div class="flex flex-col">
        <label for="email" class="text-sm text-gray-700 mb-1">Email</label>
        <input type="email" id="email" placeholder="seuemail@email.com" class="p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>

      <!-- CPF -->
      <div class="flex flex-col">
        <label for="cpf" class="text-sm text-gray-700 mb-1">CPF</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" class="p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>

      <!-- Telefone -->
      <div class="flex flex-col">
        <label for="telefone" class="text-sm text-gray-700 mb-1">Telefone</label>
        <input type="text" id="telefone" placeholder="(00) 00000-0000" class="p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>

      <!-- Endereço -->
      <div class="flex flex-col md:col-span-2">
        <label for="endereco" class="text-sm text-gray-700 mb-1">Endereço</label>
        <input type="text" id="endereco" placeholder="Rua, número, bairro" class="p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>

      <!-- Complemento -->
      <div class="flex flex-col">
        <label for="complemento" class="text-sm text-gray-700 mb-1">Complemento</label>
        <input type="text" id="complemento" placeholder="Apartamento, bloco, etc" class="p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>

      <!-- CEP -->
      <div class="flex flex-col">
        <label for="cep" class="text-sm text-gray-700 mb-1">CEP</label>
        <input type="text" id="cep" placeholder="00000-000" class="p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>

      <!-- Portaria 24h -->
      <div class="flex items-center space-x-2 md:col-span-2">
        <input type="checkbox" id="portaria24h" class="w-5 h-5 text-yellow-400 border-gray-300 rounded focus:ring-yellow-400">
        <label for="portaria24h" class="text-gray-700">Possui portaria 24 horas</label>
      </div>

      <!-- Senha atual -->
      <div class="flex flex-col">
        <label for="senhaAtual" class="text-sm text-gray-700 mb-1">Senha atual</label>
        <input type="password" id="senhaAtual" placeholder="********" class="p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400" />
      </div>

      <div class="flex flex-col">
        <label for="senha" class="text-sm text-gray-700 mb-1">Nova senha</label>
        <input type="password" id="senha" placeholder="********"
          class="p-4 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400" />
          <p id="senhaAviso" class="text-sm text-red-600 mt-1" style="display: none;"></p>
      </div>
      
      <!-- Botão -->
      <div class="md:col-span-2">
        <button type="submit" disabled class="w-full bg-yellow-400 text-black font-semibold py-3 rounded-lg shadow-md transition duration-200 text-lg opacity-50 cursor-not-allowed">
          Salvar Alterações
        </button>
      </div>
    </form>    
  </div>
</section>
