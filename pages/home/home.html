<!-- DESKTOP (aparece a partir de sm) -->
<div class="hidden sm:flex w-full bg-white px-4 sm:px-8 py-4 shadow z-20 items-center justify-between gap-4">
  <div class="flex items-center gap-3">
    <span class="text-sm italic font-semibold text-yellow-500">
      Conforto e estética <strong>Juntos! 💪</strong>
    </span>
  </div>

  <div class="flex items-center gap-2 flex-grow max-w-2xl">
    <input
      type="text"
      placeholder="Buscar produto..."
      id="searchBar"
      class="w-full p-4 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-yellow-400"
    />
    <button
      id="searchButton"
      class="bg-yellow-400 text-black py-2 px-6 rounded-lg font-semibold shadow hover:bg-yellow-300"
      onclick="searchProducts()"
    >
      Buscar
    </button>
  </div>

  <span class="text-sm italic font-semibold text-yellow-500">
    💬 Em caso de <strong>problemas</strong> com o produto, fale conosco!
  </span>
</div>

<div class="w-full flex flex-col lg:flex-row">
  <!-- Botão para mostrar menu no mobile -->
  <div class="lg:hidden p-4">
    <button id="toggleSidebar" class="w-full bg-yellow-400 text-black py-2 rounded-lg font-semibold shadow hover:bg-yellow-300">
      Categorias
    </button>
  </div>

  <aside id="sidebar" class="w-full lg:w-64 bg-white border-r border-gray-200 p-6 hidden lg:block z-10 lg:h-screen">
    <div class="mt-6 border-t pt-4">
      <h3 class="text-sm font-semibold text-yellow-500 uppercase tracking-wide mb-3"><strong>Categorias</strong></h3>
      <div class="mt-2 flex flex-wrap gap-4 sm:flex-col sm:gap-3">
        <label class="flex items-center gap-2 sm:w-full w-auto">
          <input type="checkbox" class="checkbox-amarelo form-checkbox h-5 w-5 focus:outline-none" data-category="roupas" />
          <span class="text-black text-sm font-medium">Roupas</span>
        </label>
        <label class="flex items-center gap-2 sm:w-full w-auto">
          <input type="checkbox" class="checkbox-amarelo form-checkbox h-5 w-5 focus:outline-none" data-category="academia"/>
          <span class="text-black text-sm font-medium">Academia</span>
        </label>
        <label class="flex items-center gap-2 sm:w-full w-auto">
          <input type="checkbox" class="checkbox-amarelo form-checkbox h-5 w-5 focus:outline-none" data-category="masculino"/>
          <span class="text-black text-sm font-medium">Masculino</span>
        </label>
        <label class="flex items-center gap-2 sm:w-full w-auto">
          <input type="checkbox" class="checkbox-amarelo form-checkbox h-5 w-5 focus:outline-none" data-category="feminino"/>
          <span class="text-black text-sm font-medium">Feminino</span>
        </label>
        <label class="flex items-center gap-2 sm:w-full w-auto">
          <input type="checkbox" class="checkbox-amarelo form-checkbox h-5 w-5 focus:outline-none" data-category="corrida"/>
          <span class="text-black text-sm font-medium">Corrida</span>
        </label>
        <label class="flex items-center gap-2 sm:w-full w-auto">
          <input type="checkbox" class="checkbox-amarelo form-checkbox h-5 w-5 focus:outline-none" data-category="BLUSASESCONDESHAPE"/>
          <span class="text-black text-sm font-medium">Blusas Esconde Shape</span>
        </label>
      </div>
    </div>
  </aside>
  

  <!-- Conteúdo principal -->
  <section class="w-full lg:flex-1 p-4 sm:p-6 flex flex-col justify-between">
    <div>
      <!-- Mobile Search -->
      <div class="flex sm:hidden items-center gap-2 mb-6">
        <input
          type="text"
          placeholder="Buscar produto..."
          id="searchBarMobile"
          class="flex-1 p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-yellow-400"
        />
        <button
          id="searchButtonMobile"
          class="bg-yellow-400 text-black py-2 px-4 rounded-lg font-semibold shadow hover:bg-yellow-300"
          onclick="searchProducts()"
        >
          Buscar
        </button>
      </div>

      <div class="hidden sm:block relative w-full mb-10 overflow-hidden rounded-2xl shadow-2xl">
        <div id="carousel" class="flex transition-transform duration-700 ease-in-out">
          <!-- Preenchido dinamicamente -->
        </div>
      
        <div class="absolute inset-0 bg-gradient-to-r from-white/60 via-white/10 to-transparent backdrop-blur-sm pointer-events-none rounded-2xl z-0"></div>
      
        <button onclick="moverCarrossel(-1)"
          class="absolute left-2 top-1/2 transform -translate-y-1/2 bg-white/80 text-gray-800 hover:bg-yellow-400 hover:text-black font-bold text-xl px-3 py-2 rounded-full shadow-md transition duration-300 z-10">
          ‹
        </button>
        <button onclick="moverCarrossel(1)"
          class="absolute right-2 top-1/2 transform -translate-y-1/2 bg-white/80 text-gray-800 hover:bg-yellow-400 hover:text-black font-bold text-xl px-3 py-2 rounded-full shadow-md transition duration-300 z-10">
          ›
        </button>
      </div>
      

      <!-- Grid de produtos -->
      <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6 mb-8"></div>

      <!-- Paginação -->
      <div id="pagination" class="flex flex-row justify-center items-center flex-wrap gap-2 mt-6"></div>
    </div>
  </section>
</div>
