<section class="w-full px-4 py-10 bg-gray-100 min-h-screen">
  <div class="max-w-7xl mx-auto bg-white shadow-2xl rounded-2xl p-6 lg:p-10">
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 lg:gap-8">

      <!-- Coluna 1: Lista de Produtos -->
      <div id="resumoProdutosPagamento" class="lg:col-span-1 space-y-4 bg-gray-50 p-4 rounded-xl border overflow-hidden overflow-y-auto max-h-[1800px]">
        <!-- Produtos renderizados por JS -->
      </div>

      <!-- Coluna 2: Formas de Pagamento -->
      <div class="lg:col-span-2 bg-gray-50 p-6 rounded-xl border shadow space-y-6">
        <h3 class="text-2xl font-bold text-gray-700">Formas de Pagamento</h3>

        <div class="space-y-4 divide-y divide-gray-300">
          <label class="flex items-center gap-3 text-lg py-2">
            <input type="radio" name="metodoPagamento" value="1" class="form-radio text-yellow-400" onchange="mostrarFormularioPagamento(1);">
            Pix
          </label>

          <label class="flex items-center gap-3 text-lg py-2">
            <input type="radio" name="metodoPagamento" value="2" class="form-radio text-yellow-400" onchange="mostrarFormularioPagamento(2);">
            Cartão de Crédito/Débito <span class="text-sm text-gray-500">(em até 10x no crédito)</span>
          </label>
        </div>
      
        <!-- Checkbox para usar dados do usuário -->
        <div class="mt-8 space-y-4">
          <label class="flex items-center gap-3 text-lg py-2">
            <input type="checkbox" id="usarDadosUsuario" class="checkbox-amarelo form-checkbox h-5 w-5 focus:outline-none" onchange="toggleFormularioEndereco(); atualizarEstadoBotaoFinalizar();">
            Usar dados do usuário logado.
          </label>

          <!-- Formulário de dados do usuário -->
          <div id="formularioEndereco" class="mt-8 space-y-4 bg-yellow-100 border border-yellow-300 p-5 rounded-lg shadow text-base text-gray-700">
            <span class="text-sm italic font-semibold text-yellow-500">
              Preencha os dados para envio do pedido.
            </span>
            <input type="text" id="inputNome" maxlength="150" placeholder="Nome Completo" class="w-full p-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400" oninput="atualizarEstadoBotaoFinalizar()">
            <input type="text" id="inputEndereco" maxlength="150" placeholder="Endereço" class="w-full p-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400" oninput="atualizarEstadoBotaoFinalizar()">
            <input type="text" id="inputComplemento" maxlength="150" placeholder="Complemento (opcional)" class="w-full p-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400">
            <input
              type="tel"
              id="inputCep"
              maxlength="8"
              inputmode="numeric"
              pattern="[0-9]*"
              placeholder="CEP"
              class="w-full p-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400"
              oninput="atualizarEstadoBotaoFinalizar()"
            />
            <div class="flex flex-col">
              <input type="text" id="cpf" maxlength="14" placeholder="CPF: 000.000.000-00" class="p-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400" oninput="atualizarEstadoBotaoFinalizar()">
            </div>
            <div class="flex items-center space-x-2 md:col-span-2">
              <input type="checkbox" id="portaria24h" class="checkbox-amarelo w-5 h-5 text-yellow-400 border-gray-300 rounded focus:ring-yellow-400">
              <label for="portaria24h" class="text-gray-700">Possui portaria 24 horas</label>
            </div>
          </div>
        </div>
      </div>

      <!-- Coluna 3: Cupom e Finalização -->
      <div class="space-y-6 bg-gray-50 p-6 rounded-xl border h-fit">
        <div class="space-y-3">
          <label class="block text-gray-700 font-semibold text-lg">Cupom de Desconto</label>
          <div class="flex flex-col gap-3">
            <input id="cupomInput" maxlength="50" type="text" placeholder="Digite seu cupom" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400">
            <button onclick="aplicarCupom()" class="w-full bg-yellow-400 hover:bg-yellow-300 text-black font-bold p-3 rounded-lg">Aplicar</button>
          </div>
          <p id="cupomFeedback" class="text-sm mt-1 text-green-600 hidden">Cupom aplicado com sucesso!</p>
        </div>

        <div class="text-lg flex justify-between font-bold border-t pt-4">
          <span>Total:</span>
          <span id="valorTotal" class="text-yellow-600">R$ 0,00</span>
        </div>

        <p id="freteInfo" class="text-base font-semibold mt-2 bg-gray-200 p-2 rounded"></p>

        <button id="btnFinalizarCompra" onclick="finalizarPagamento()" disabled class="w-full bg-yellow-400 hover:bg-yellow-300 text-black font-bold py-3 rounded-xl shadow-lg transition text-lg flex items-center justify-center gap-2">
          Finalizar Compra
          <i class="fas fa-lock"></i>
        </button>
      </div>

    </div>
  </div>
</section>

<!-- Popup de sucesso -->
<div id="popupPagamento" class="fixed bottom-6 right-6 bg-green-500 text-white px-6 py-4 rounded-xl shadow-lg text-sm font-semibold opacity-0 pointer-events-none transition-opacity duration-300 z-50">
  Pagamento realizado com sucesso!
</div>
