<!-- Procure e descubra! -->
<section
  id="procureDescubra"
  class="relative w-full overflow-x-clip bg-gradient-to-b from-black via-zinc-900 to-zinc-800 text-white"
>
  <!-- BG efeito -->
  <div aria-hidden="true" class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -top-32 -left-24 w-80 h-80 rounded-full bg-yellow-400/10 blur-3xl"></div>
    <div class="absolute -bottom-32 -right-24 w-96 h-96 rounded-full bg-yellow-500/10 blur-3xl"></div>
  </div>

  <div class="relative max-w-6xl mx-auto px-4 py-14">
    <header class="text-center mb-10">
      <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">
        Procure <span class="text-yellow-400">&</span> Descubra!
      </h1>
        <p class="mt-3 text-zinc-300 max-w-2xl mx-auto">
        Digite a referência (ex.: <strong>João 3:16</strong>) ou use a busca avançada.
        <span class="block mt-2">Obs.: Aqui estão os versículos das nossas peças — e alguns que chegam em breve.</span>
        </p>
    </header>

    <!-- Busca rápida (input em cima, botões embaixo) -->
    <div class="max-w-3xl mx-auto">
      <!-- Campo -->
      <div class="relative rounded-2xl overflow-hidden shadow-xl ring-1 ring-yellow-300/40 bg-white
                  focus-within:ring-2 focus-within:ring-yellow-400 transition">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-yellow-400">
          <i class="fas fa-book-open"></i>
        </span>
        <input
          id="refInput"
          type="text"
          inputmode="text"
          autocomplete="off"
          placeholder="Ex.: João 3:16  |  Sl 23:1-3  |  1 Coríntios 13"
          class="w-full pl-11 pr-4 py-4 bg-transparent text-black placeholder-zinc-500
                 selection:bg-yellow-200/60 focus:outline-none"
          aria-label="Digite a referência bíblica" />
      </div>

      <!-- Botões (abaixo, centralizados) -->
      <div class="mt-3 flex items-center justify-center gap-3">
        <button
          id="btnLimparSimples"
          type="button"
          class="px-4 h-11 rounded-xl bg-zinc-700 text-white hover:bg-zinc-600
                 focus:outline-none focus:ring-2 focus:ring-yellow-300 shadow-md">
          Limpar
        </button>

        <button
          id="btnBuscar"
          type="button"
          class="px-5 h-11 rounded-xl bg-yellow-400 hover:bg-yellow-500 active:bg-yellow-600
                 text-black font-bold shadow-md focus:outline-none focus:ring-2 focus:ring-yellow-300">
          Buscar
        </button>
      </div>

      <!-- Toggle avançado centralizado -->
      <div class="mt-3 text-center">
        <button id="toggleAvancado" class="text-sm text-zinc-300 hover:text-yellow-400">
          Busca avançada
        </button>
      </div>

      <!-- Busca avançada -->
      <div id="areaAvancada" class="mt-4 hidden">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
          <div class="md:col-span-6">
            <label class="text-sm text-zinc-300">Livro</label>
            <select
              id="selectLivro"
              class="mt-1 w-full px-3 py-3 rounded-xl bg-white text-black
                     ring-1 ring-zinc-300 focus:ring-2 focus:ring-yellow-400">
              <option value="">Selecione...</option>
            </select>
          </div>

          <div class="md:col-span-3">
            <label class="text-sm text-zinc-300">Capítulo</label>
            <input
              id="inputCapitulo"
              type="number"
              min="1"
              placeholder="Ex.: 3"
              class="mt-1 w-full px-3 py-3 rounded-xl bg-white text-black
                     ring-1 ring-zinc-300 placeholder-zinc-500
                     focus:ring-2 focus:ring-yellow-400" />
          </div>

          <div class="md:col-span-3">
            <label class="text-sm text-zinc-300">Versículo(s)</label>
            <input
              id="inputVersiculo"
              type="text"
              placeholder="16 | 16-18,21"
              class="mt-1 w-full px-3 py-3 rounded-xl bg-white text-black
                     ring-1 ring-zinc-300 placeholder-zinc-500
                     focus:ring-2 focus:ring-yellow-400" />
          </div>
        </div>

        <div class="mt-3 flex justify-end gap-2">
          <button
            id="btnLimparAv"
            type="button"
            class="px-4 py-2 rounded-xl bg-zinc-700 text-white hover:bg-zinc-600
                   focus:outline-none focus:ring-2 focus:ring-yellow-300 shadow-md">
            Limpar
          </button>

          <button
            id="btnBuscarAv"
            type="button"
            class="px-5 py-2 rounded-xl bg-yellow-400 hover:bg-yellow-500 active:bg-yellow-600
                   text-black font-bold shadow-md">
            Buscar
          </button>
        </div>
      </div>
    </div>

    <!-- Estado: carregando -->
    <div id="loading" class="hidden mt-10">
      <div class="animate-pulse bg-white/5 ring-1 ring-white/10 rounded-2xl p-6">
        <div class="h-5 w-40 bg-white/10 rounded mb-3"></div>
        <div class="h-4 w-full bg-white/10 rounded mb-2"></div>
        <div class="h-4 w-11/12 bg-white/10 rounded mb-2"></div>
        <div class="h-4 w-9/12 bg-white/10 rounded"></div>
      </div>
    </div>

    <!-- Resultado -->
    <div id="resultado" class="mt-10 space-y-6"></div>

    <!-- Alertas -->
    <div id="msg" class="mt-6 hidden"></div>
  </div>
</section>
